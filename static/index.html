<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" media="screen" href="style.css">
    <title>Forms lab 3</title>
</head>

<body>
    <header>
        <h1>
            Lab3: FormHandling
        </h1>
    </header>
    <form action="/palyabevezet" method="POST">
        <label for="palyak">Valassz egy palyat: </label>
        <select name="palyak" id="palyak" required>
            <option value="kosar">Kosar</option>
            <option value="foci">Foci</option>
            <option value="tenisz">Tenisz</option>
            <option value="futas">Futas</option>
        </select>
        <label for="f0oraber">Add meg az orabert: </label>
        <input type="number" name="f0oraber" id="f0oraber" min="0" required>
        <label for="f0cim">Add meg a cimet: </label>
        <input type="text" name="f0cim" id="f0cim" required>
        <label for="f0leiras">Add meg a leirast: </label>
        <input type="text" name="f0leiras" id="f0leiras" required>
        <button type="submit">Submit</button>
    </form>

    <form action="/kepfeltolt" method="POST" enctype="multipart/form-data">
        <label for="f1palyaid">Add meg a palyaidt: </label>
        <input type="text" name="f1palyaid" id="f1palyaid" required>
        <label for="f1kep">Tolts fel egy kepet: </label>
        <input type="file" name="f1kep" id="f1kep" required>
        <button type="submit">Submit</button>
    </form>

    <form action="/kliensszur" method="POST">
        <label for="palyakkliens">Valassz egy palyat: </label>
        <select name="palyakkliens" id="palyakkliens" required>
            <option value="kosar">Kosar</option>
            <option value="foci">Foci</option>
            <option value="tenisz">Tenisz</option>
            <option value="futas">Futas</option>
        </select>

        <label for="f3orabermin">Add meg a minimum orabert: </label>
        <input type="number" name="f3orabermin" id="f3orabermin" min="0" required>

        <label for="f3orabermax">Add meg a maximum orabert: </label>
        <input type="number" name="f3orabermax" id="f3orabermax" min="0" required>
        <button type="submit">Submit</button>

    </form>

    <footer>
        Bencze Marton, bmim2214, 521, lab3
    </footer>

</body>

</html>
